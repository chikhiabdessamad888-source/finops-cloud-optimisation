name: FinOps CD

on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Release Archive
        run: |
          mkdir -p dist
          zip -r dist/finops-projet.zip app.py analyse_consommation_cloud.py monitoring_zombies.py requirements.txt pyproject.toml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/finops-projet.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}